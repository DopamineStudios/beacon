[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-beacon"
version = "4.6.2"
authors = [{name = "ismite"}]
description = "Initialise a production-ready Discord.py bot in just 4 lines of code using Beacon, the most advanced unonionated framework for discord.py. Smart and automated command syncing, preconditions (and its presets), customisable command rate limits, easy-to-use in-Discord dashboard, Helper Views, and more. A Dopamine Studios project."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "discord.py~=2.7.0",
    "psutil",
    "pillow",
    "geocoder"
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "pytest-timeout>=2.1.0",
    "pytest-xdist>=3.3.0",
    "freezegun>=1.2.2",
    "aioresponses>=0.7.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"beacon.ext" = ["*.ttf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow running tests",
]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-v",
]

[tool.coverage.run]
source = ["src/beacon"]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
precision = 2
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"
